<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Opaque forest background for iOS home-screen icons -->
  <rect width="512" height="512" fill="#1a2418"/>
  <!-- Simplified fox head, inset for squircle safe area -->
  <g fill="#f0c56a">
    <!-- Left ear -->
    <polygon points="128,210 168,92 248,168"/>
    <!-- Right ear -->
    <polygon points="384,210 344,92 264,168"/>
    <!-- Face -->
    <ellipse cx="256" cy="268" rx="148" ry="132"/>
    <!-- Snout -->
    <ellipse cx="256" cy="330" rx="62" ry="48"/>
  </g>
  <!-- Inner ear accents -->
  <polygon points="156,198 176,128 220,172" fill="#d49a3a"/>
  <polygon points="356,198 336,128 292,172" fill="#d49a3a"/>
  <!-- Eyes -->
  <ellipse cx="206" cy="248" rx="18" ry="22" fill="#1a2418"/>
  <ellipse cx="306" cy="248" rx="18" ry="22" fill="#1a2418"/>
  <!-- Nose -->
  <ellipse cx="256" cy="318" rx="16" ry="12" fill="#1a2418"/>
</svg>
